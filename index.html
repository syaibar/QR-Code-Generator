<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background-color: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      padding: 30px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-sizing: border-box;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #333;
    }
    .input-group {
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 10px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s ease;
    }
    input[type="text"]:focus {
      border-color: #4CAF50;
    }
    .qr-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .qr-options input {
      width: 45%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 8px;
      border: 2px solid #ddd;
      transition: border-color 0.3s ease;
    }
    .qr-options input:focus {
      border-color: #4CAF50;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 15px 20px;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #45a049;
    }
    .qr-code {
      margin-top: 20px;
      display: none;
      transition: opacity 0.5s ease;
    }
    img {
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
      display: block;
      border-radius: 10px;
    }
    .footer {
      margin-top: 20px;
      font-size: 0.9em;
      color: #777;
    }
    .footer a {
      color: #4CAF50;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>QR Code Generator</h1>
    <div class="input-group">
      <input type="text" id="qr-input" placeholder="Masukkan URL atau Teks" />
    </div>
    <div class="qr-options">
      <input type="number" id="qr-size" placeholder="Ukuran (min 100)" value="200" min="100" />
    </div><br>
    <button onclick="generateQRCode()">Buat QR Code</button>

    <div class="qr-code" id="qr-code">
      <h2>QR Code Anda</h2>
      <img id="qr-img" src="" alt="QR Code">
    </div>

    <div class="footer">
      <p>Built with ❤️ by <a href="https://github.com/your-username" target="_blank">Your Name</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script>
    function generateQRCode() {
      const inputText = document.getElementById("qr-input").value;
      const size = parseInt(document.getElementById("qr-size").value);

      if (inputText === "") {
        alert("Masukkan teks atau URL untuk QR Code");
        return;
      }

      if (size < 100) {
        alert("Ukuran QR Code minimal 100px");
        return;
      }

      // Menghasilkan QR Code
      QRCode.toDataURL(inputText, { width: size, height: size }, function (err, url) {
        if (err) {
          alert("Terjadi kesalahan dalam membuat QR Code");
          return;
        }
        // Menampilkan QR Code di halaman
        const qrCodeElement = document.getElementById("qr-code");
        qrCodeElement.style.display = "block";
        document.getElementById("qr-img").src = url;

        // Animasi tampilan
        setTimeout(function() {
          qrCodeElement.style.opacity = 1;
        }, 100);
      });
    }
  </script>
</body>
</html>
